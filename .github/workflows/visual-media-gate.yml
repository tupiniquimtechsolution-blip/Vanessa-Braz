name: Visual media gate

on:
  workflow_dispatch:
  push:
    branches:
      - media/automated-image-pipeline
    paths:
      - scripts/media/visual_audit_gate.py
      - scripts/media/responsive_visual_evidence.py
      - .github/workflows/visual-media-gate.yml

permissions:
  contents: write

concurrency:
  group: visual-media-gate-media-automated-image-pipeline
  cancel-in-progress: false

jobs:
  visual-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated media branch
        uses: actions/checkout@v4
        with:
          ref: media/automated-image-pipeline
          fetch-depth: 0

      - name: Assert branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "media/automated-image-pipeline"
          echo "Visual gate isolated on media/automated-image-pipeline"

      - name: Snapshot immutable media
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-before.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit-only image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88

      - name: Generate main visual evidence and quantitative precheck
        run: python scripts/media/visual_audit_gate.py --prepare-only

      - name: Generate equal-scale responsive visual evidence
        run: python scripts/media/responsive_visual_evidence.py

      - name: Write truthful review checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path('apps/web/public/media/optimized/audit/visual')
          precheck = json.loads((root / 'visual-precheck.json').read_text(encoding='utf-8'))
          records = precheck.get('records', [])
          responsive = precheck.get('responsive_sample', [])

          # This workflow produces evidence only. A future reviewed decision file
          # must never be fabricated automatically.
          decisions_path = root / 'manual-decisions.json'
          if decisions_path.exists():
              decisions_path.unlink()

          items = []
          for record in records:
              items.append({
                  'category': record['category'],
                  'position': record['position'],
                  'source_name': record['source_name'],
                  'visual_quality_status': 'REVIEW',
                  'final_variant': 'PENDING_MANUAL_REVIEW',
                  'quantitative_precheck_status': record.get('suggested_status'),
                  'defects': record.get('defects', {}),
                  'metrics': record.get('metrics', {}),
                  'publication_authorization_status': 'PENDENTE_DE_CONFIRMACAO',
                  'review_note': 'Evidence generated. Final visual decision requires inspection of the contact sheets.',
              })

          responsive_items = [{
              'category': record['category'],
              'position': record['position'],
              'source_name': record['source_name'],
              'status': 'REVIEW',
              'review_note': 'Equal-scale responsive evidence generated; final decision requires visual inspection.',
          } for record in responsive]

          audit = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'status_basis': 'Evidence generated only. No fabricated manual decisions.',
              'total_uses': len(items),
              'pass_count': 0,
              'review_count': len(items),
              'fail_count': 0,
              'hero_1_status': 'REVIEW',
              'hero_1_final_variant': 'PENDING_MANUAL_REVIEW',
              'hero_2_status': 'REVIEW',
              'hero_2_final_variant': 'PENDING_MANUAL_REVIEW',
              'web_final_count': 0,
              'original_final_count': 0,
              'enhanced_final_count': 0,
              'responsive_sample_pass': 0,
              'responsive_sample_review': len(responsive_items),
              'responsive_sample_fail': 0,
              'publication_authorization_pending_count': len(items),
              'visual_gate_status': 'BLOCKED_FOR_MANUAL_REVIEW',
              'items': items,
              'responsive_sample': responsive_items,
              'responsive_evidence_path': 'apps/web/public/media/optimized/audit/visual/responsive/responsive-evidence.json',
          }
          (root / 'visual-audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          md = [
              '# VISUAL_AUDIT — Vanessa Braz', '',
              f"TOTAL_USES={audit['total_uses']}",
              f"PASS_COUNT={audit['pass_count']}",
              f"REVIEW_COUNT={audit['review_count']}",
              f"FAIL_COUNT={audit['fail_count']}", '',
              f"HERO_1_STATUS={audit['hero_1_status']}",
              f"HERO_1_FINAL_VARIANT={audit['hero_1_final_variant']}",
              f"HERO_2_STATUS={audit['hero_2_status']}",
              f"HERO_2_FINAL_VARIANT={audit['hero_2_final_variant']}", '',
              f"WEB_FINAL_COUNT={audit['web_final_count']}",
              f"ORIGINAL_FINAL_COUNT={audit['original_final_count']}",
              f"ENHANCED_FINAL_COUNT={audit['enhanced_final_count']}", '',
              f"RESPONSIVE_SAMPLE_PASS={audit['responsive_sample_pass']}",
              f"RESPONSIVE_SAMPLE_REVIEW={audit['responsive_sample_review']}",
              f"RESPONSIVE_SAMPLE_FAIL={audit['responsive_sample_fail']}", '',
              f"PUBLICATION_AUTHORIZATION_PENDING_COUNT={audit['publication_authorization_pending_count']}",
              f"VISUAL_GATE_STATUS={audit['visual_gate_status']}", '',
              '## Audit note', '',
              '- Main and responsive contact sheets are evidence only.',
              '- Responsive comparisons normalize ORIGINAL and MAIN-WEB to the candidate viewport before comparison.',
              '- Quantitative metrics do not substitute visual inspection.',
              '- No PASS/FAIL is synthesized by this workflow.',
              '- Publication authorization remains separate from visual quality.',
              '- Frontend, backend, media/source, enhanced assets and structural manifests remain unchanged.', '',
              '## Per-use checkpoint', '',
          ]
          for row in items:
              md.append(f"- {row['category']} #{row['position']} `{row['source_name']}` — REVIEW; quantitative_precheck={row['quantitative_precheck_status']}; final=PENDING_MANUAL_REVIEW")
          (root / 'VISUAL_AUDIT.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          PY

      - name: Upload visual evidence for inspection
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-evidence
          path: apps/web/public/media/optimized/audit/visual/
          if-no-files-found: error
          retention-days: 7

      - name: Verify immutable media unchanged
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-after.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-after.sha256
          diff -u /tmp/source-before.sha256 /tmp/source-after.sha256
          diff -u /tmp/enhanced-before.sha256 /tmp/enhanced-after.sha256

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(git status --short | grep -Ev 'apps/web/public/media/optimized/audit/visual/' || true)
          if [ -n "$BAD" ]; then
            echo 'ERROR: visual gate changed files outside audit/visual:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          if git status --short | grep -Eq '^.. (src/|apps/web/src/|server/|api/|tests/|apps/web/public/media/source/|apps/web/public/media/optimized/enhanced/|apps/web/public/media/optimized/manifests/)'; then
            echo 'ERROR: forbidden project/media scope changed.' >&2
            exit 1
          fi

      - name: Commit audit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web/public/media/optimized/audit/visual
          if git diff --cached --quiet; then
            echo 'No visual audit changes to commit.'
            exit 0
          fi
          git commit -m 'docs(media): add responsive visual evidence [skip ci]'
          git push origin HEAD:media/automated-image-pipeline
