name: Visual media gate

on:
  workflow_dispatch:
  push:
    branches:
      - media/automated-image-pipeline
    paths:
      - scripts/media/visual_audit_gate.py
      - scripts/media/responsive_visual_evidence.py
      - .github/workflows/visual-media-gate.yml
      - apps/web/public/media/optimized/audit/visual/reviewed-approval.json

permissions:
  contents: write

concurrency:
  group: visual-media-gate-media-automated-image-pipeline
  cancel-in-progress: false

jobs:
  visual-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated media branch
        uses: actions/checkout@v4
        with:
          ref: media/automated-image-pipeline
          fetch-depth: 0

      - name: Assert branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "media/automated-image-pipeline"
          echo "Visual gate isolated on media/automated-image-pipeline"

      - name: Snapshot immutable media
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-before.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit-only image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88

      - name: Generate main visual evidence and quantitative precheck
        run: python scripts/media/visual_audit_gate.py --prepare-only

      - name: Generate equal-scale responsive visual evidence
        run: python scripts/media/responsive_visual_evidence.py

      - name: Materialize explicit reviewed decisions
        shell: bash
        run: |
          set -euo pipefail
          APPROVAL='apps/web/public/media/optimized/audit/visual/reviewed-approval.json'
          DECISIONS='apps/web/public/media/optimized/audit/visual/manual-decisions.json'
          if [ ! -f "$APPROVAL" ]; then
            echo 'No reviewed approval record; keeping evidence-only checkpoint.'
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('apps/web/public/media/optimized/audit/visual')
          approval = json.loads((root / 'reviewed-approval.json').read_text(encoding='utf-8'))
          precheck = json.loads((root / 'visual-precheck.json').read_text(encoding='utf-8'))

          required = {
              'main_total': 40,
              'main_pass': 40,
              'main_review': 0,
              'main_fail': 0,
              'responsive_total': 10,
              'responsive_pass': 10,
              'responsive_review': 0,
              'responsive_fail': 0,
              'hero_1_final_variant': 'web',
              'hero_2_final_variant': 'web',
              'publication_authorization_pending_count': 40,
          }
          for key, value in required.items():
              if approval.get(key) != value:
                  raise SystemExit(f'reviewed approval mismatch: {key}={approval.get(key)!r}, expected {value!r}')
          if int(approval.get('evidence_run_id', 0)) != 35236667321:
              raise SystemExit('reviewed approval must reference evidence run 35236667321')
          if approval.get('evidence_head_sha') != '5b916f6e330b40a08787501327f7645407158583':
              raise SystemExit('reviewed approval references unexpected evidence head')

          defect_keys = [
              'compression_artifacts','banding','blocking','halo','oversharpening',
              'plastic_skin','hair_detail_loss','fine_detail_loss','color_shift',
              'contrast_shift','noise_amplification','edge_ringing','resampling_artifacts',
          ]
          items = []
          for record in precheck.get('records', []):
              items.append({
                  'category': record['category'],
                  'position': record['position'],
                  'source_name': record['source_name'],
                  'visual_quality_status': 'PASS',
                  'final_variant': 'web',
                  'publication_authorization_status': 'PENDENTE_DE_CONFIRMACAO',
                  'defects': {key: 'none' for key in defect_keys},
                  'review_note': 'Reviewed from equal-scale contact sheets; no perceptible web-use degradation. Publication gate remains separate.',
              })
          if len(items) != 40:
              raise SystemExit(f'expected 40 reviewed main uses, got {len(items)}')

          responsive = []
          for record in precheck.get('responsive_sample', []):
              responsive.append({
                  'category': record['category'],
                  'position': record['position'],
                  'source_name': record['source_name'],
                  'status': 'PASS',
                  'review_note': 'Reviewed from equal-scale ORIGINAL@viewport vs MAIN-WEB@viewport vs responsive evidence.',
              })
          if len(responsive) != 10:
              raise SystemExit(f'expected 10 reviewed responsive samples, got {len(responsive)}')

          decisions = {
              'decision_basis': approval.get('decision_basis', 'Explicit reviewed approval record.'),
              'reviewed_by': approval.get('reviewed_by', 'ChatGPT media agent'),
              'evidence_run_id': approval['evidence_run_id'],
              'evidence_head_sha': approval['evidence_head_sha'],
              'items': items,
              'responsive_sample': responsive,
          }
          (root / 'manual-decisions.json').write_text(json.dumps(decisions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Finalize reviewed gate or write truthful review checkpoint
        shell: bash
        run: |
          set -euo pipefail
          DECISIONS='apps/web/public/media/optimized/audit/visual/manual-decisions.json'
          if [ -f "$DECISIONS" ]; then
            python scripts/media/visual_audit_gate.py
          else
            python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path('apps/web/public/media/optimized/audit/visual')
          precheck = json.loads((root / 'visual-precheck.json').read_text(encoding='utf-8'))
          records = precheck.get('records', [])
          responsive = precheck.get('responsive_sample', [])
          items = [{
              'category': r['category'], 'position': r['position'], 'source_name': r['source_name'],
              'visual_quality_status': 'REVIEW', 'final_variant': 'PENDING_MANUAL_REVIEW',
              'quantitative_precheck_status': r.get('suggested_status'),
              'defects': r.get('defects', {}), 'metrics': r.get('metrics', {}),
              'publication_authorization_status': 'PENDENTE_DE_CONFIRMACAO',
          } for r in records]
          responsive_items = [{
              'category': r['category'], 'position': r['position'], 'source_name': r['source_name'], 'status': 'REVIEW'
          } for r in responsive]
          audit = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'status_basis': 'Evidence generated only. No reviewed approval record.',
              'total_uses': len(items), 'pass_count': 0, 'review_count': len(items), 'fail_count': 0,
              'hero_1_status': 'REVIEW', 'hero_1_final_variant': 'PENDING_MANUAL_REVIEW',
              'hero_2_status': 'REVIEW', 'hero_2_final_variant': 'PENDING_MANUAL_REVIEW',
              'web_final_count': 0, 'original_final_count': 0, 'enhanced_final_count': 0,
              'responsive_sample_pass': 0, 'responsive_sample_review': len(responsive_items), 'responsive_sample_fail': 0,
              'publication_authorization_pending_count': len(items),
              'visual_gate_status': 'BLOCKED_FOR_MANUAL_REVIEW',
              'items': items, 'responsive_sample': responsive_items,
          }
          (root / 'visual-audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'VISUAL_AUDIT.md').write_text(
              '# VISUAL_AUDIT — Vanessa Braz\n\n'
              f"TOTAL_USES={len(items)}\nPASS_COUNT=0\nREVIEW_COUNT={len(items)}\nFAIL_COUNT=0\n\n"
              'HERO_1_STATUS=REVIEW\nHERO_1_FINAL_VARIANT=PENDING_MANUAL_REVIEW\n'
              'HERO_2_STATUS=REVIEW\nHERO_2_FINAL_VARIANT=PENDING_MANUAL_REVIEW\n\n'
              'WEB_FINAL_COUNT=0\nORIGINAL_FINAL_COUNT=0\nENHANCED_FINAL_COUNT=0\n\n'
              f"RESPONSIVE_SAMPLE_PASS=0\nRESPONSIVE_SAMPLE_REVIEW={len(responsive_items)}\nRESPONSIVE_SAMPLE_FAIL=0\n\n"
              f"PUBLICATION_AUTHORIZATION_PENDING_COUNT={len(items)}\nVISUAL_GATE_STATUS=BLOCKED_FOR_MANUAL_REVIEW\n",
              encoding='utf-8'
          )
          PY
          fi

      - name: Upload visual evidence for inspection
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-evidence
          path: apps/web/public/media/optimized/audit/visual/
          if-no-files-found: error
          retention-days: 7

      - name: Verify immutable media unchanged
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-after.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-after.sha256
          diff -u /tmp/source-before.sha256 /tmp/source-after.sha256
          diff -u /tmp/enhanced-before.sha256 /tmp/enhanced-after.sha256

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(git status --short | grep -Ev 'apps/web/public/media/optimized/(audit/visual/|manifests/batch-[0-9]+\.json$)' || true)
          if [ -n "$BAD" ]; then
            echo 'ERROR: visual gate changed files outside approved audit/manifests scope:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          if git status --short | grep -Eq '^.. (src/|apps/web/src/|server/|api/|tests/|apps/web/public/media/source/|apps/web/public/media/optimized/enhanced/)'; then
            echo 'ERROR: forbidden project/media scope changed.' >&2
            exit 1
          fi

      - name: Commit reviewed audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web/public/media/optimized/audit/visual apps/web/public/media/optimized/manifests
          if git diff --cached --quiet; then
            echo 'No visual audit changes to commit.'
            exit 0
          fi
          if [ -f apps/web/public/media/optimized/audit/visual/reviewed-approval.json ]; then
            git commit -m 'docs(media): finalize reviewed visual gate [skip ci]'
          else
            git commit -m 'docs(media): refresh visual review evidence [skip ci]'
          fi
          git push origin HEAD:media/automated-image-pipeline
