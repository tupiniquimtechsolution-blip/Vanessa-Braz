name: Migrate canonical Vanessa Braz repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-canonical-repo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: tupiniquimtechsolution-blip/VanessaBraz-Beleza-e-Autoestima
          ref: main
          path: source

      - name: Copy canonical contents except workflow files
        run: |
          set -euo pipefail
          find source -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec cp -a {} target/ \;
          echo "Source files outside .github: $(find source -type f -not -path 'source/.git/*' -not -path 'source/.github/*' | wc -l)"
          echo "Target files before commit: $(find target -type f -not -path 'target/.git/*' | wc -l)"

      - name: Commit migration
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(repo): migrate canonical Vanessa Braz project"
          git push origin HEAD:main

      - name: Verify critical assets
        working-directory: target
        run: |
          set -euo pipefail
          test -f QWEN.md
          test -f docs/MEDIA_USAGE.md
          test -f docs/DESIGN_DIRECTION.md
          test -f apps/web/public/media/source/media-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('apps/web/public/media/source/media-manifest.json').read_text(encoding='utf-8'))
          assert data['downloaded_files'] == 185
          assert data['images'] == 157
          assert data['videos'] == 28
          assert data['failed_files'] == 0
          print('Media manifest verified: 185 files, 157 images, 28 videos, 0 failures')
          PY
