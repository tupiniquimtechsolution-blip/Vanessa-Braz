name: UI visual review

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/clandestine-layout-refresh
    paths:
      - 'src/**'
      - 'public/**'
      - 'apps/web/public/media/**'
      - 'scripts/ui-visual-review.cjs'
      - '.github/workflows/ui-visual-review.yml'

permissions:
  contents: read

concurrency:
  group: ui-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vanessa-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vanessa-preview.log
          exit 1

      - name: Capture scroll-aware desktop and mobile pages
        run: |
          set -euo pipefail
          node scripts/ui-visual-review.cjs
          cp /tmp/vanessa-preview.log visual-review/preview-server.log

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-visual-review-${{ github.sha }}
          path: visual-review/
          if-no-files-found: warn
          retention-days: 7
