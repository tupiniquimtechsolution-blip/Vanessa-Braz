name: Optimize media batch

on:
  push:
    branches:
      - media/automated-image-pipeline
    paths:
      - 'media-batches/*.json'
      - 'scripts/media/optimize_images.py'
      - 'scripts/media/audit_manifests.py'
      - '.github/workflows/optimize-media-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vanessa-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.ref_name == 'media/automated-image-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest isolated media branch
        uses: actions/checkout@v4
        with:
          ref: media/automated-image-pipeline
          fetch-depth: 0

      - name: Assert branch isolation
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="$(git branch --show-current)"
          test "$BRANCH" = "media/automated-image-pipeline"
          echo "Media pipeline is isolated on $BRANCH"

      - name: Snapshot immutable source and enhanced hashes
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source/images -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-before.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image processor
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Resolve all seven batch manifests
        id: batches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files 'media-batches/batch-*.json' | sort)
          test "${#FILES[@]}" -eq 7
          printf '%s\n' "${FILES[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${FILES[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Reprocess WEB only for all batches
        shell: bash
        env:
          BATCH_FILES: ${{ steps.batches.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r batch; do
            [ -n "$batch" ] || continue
            python scripts/media/optimize_images.py --batch "$batch"
          done <<< "$BATCH_FILES"

      - name: Verify source and enhanced are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/public/media/source/images -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-after.sha256
          find apps/web/public/media/optimized/enhanced -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/enhanced-after.sha256
          diff -u /tmp/source-before.sha256 /tmp/source-after.sha256
          diff -u /tmp/enhanced-before.sha256 /tmp/enhanced-after.sha256
          if git diff --name-only | grep -q '^apps/web/public/media/source/'; then
            echo 'ERROR: source media was modified.' >&2
            exit 1
          fi
          if git diff --name-only | grep -q '^apps/web/public/media/optimized/enhanced/'; then
            echo 'ERROR: enhanced media was modified.' >&2
            exit 1
          fi

      - name: Fetch audited frontend branch read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin arena/01a0a695-vanessa-braz
          git show FETCH_HEAD:src/lib/media.ts > /tmp/frontend-media.ts
          echo "FRONTEND_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Run WEB-v2 exhaustive audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/media/audit_manifests.py \
            --frontend-media /tmp/frontend-media.ts \
            --frontend-ref "arena/01a0a695-vanessa-braz@$FRONTEND_SHA"

      - name: Guard repository size
        shell: bash
        run: |
          set -euo pipefail
          if find apps/web/public/media/optimized -type f -size +20M -print -quit | grep -q .; then
            echo 'ERROR: an optimized file exceeds 20 MB.' >&2
            exit 1
          fi
          TOTAL=$(du -sb apps/web/public/media/optimized | cut -f1)
          LIMIT=$((250 * 1024 * 1024))
          echo "Optimized media bytes: $TOTAL"
          test "$TOTAL" -le "$LIMIT"

      - name: Verify no frontend or backend changes
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(git status --short | grep -Ev 'apps/web/public/media/optimized/(web/|manifests/|audit/)' || true)
          if [ -n "$BAD" ]; then
            echo 'ERROR: WEB-v2 run changed files outside allowed media outputs:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi

      - name: Commit WEB-v2 derivatives, manifests and audit only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/media/optimized/web apps/web/public/media/optimized/manifests apps/web/public/media/optimized/audit
          if git diff --cached --quiet; then
            echo 'No WEB-v2 changes to commit.'
            exit 0
          fi
          git commit -m 'assets(media): adaptive WEB-v2 optimization and audit [skip ci]'
          git push origin HEAD:media/automated-image-pipeline
